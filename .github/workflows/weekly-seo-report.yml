name: Report SEO settimanale

on:
  schedule:
    - cron: '17 8 * * 1'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-seo-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Installa autenticazione Google
        run: python -m pip install --disable-pip-version-check google-auth==2.40.3
      - name: Invia report Search Console
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          SEARCH_CONSOLE_PROPERTY: sc-domain:costo-vero.it
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: mat.perrone@gmail.com
        run: python .github/scripts/send_weekly_seo_report.py
