name: Report quotidiano Costo Vero

on:
  schedule:
    # Due finestre UTC: il job prosegue solo quando in Italia sono le 20:00,
    # quindi gestisce automaticamente ora solare e ora legale.
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica orario italiano
        id: italy-time
        run: |
          if [ "$(TZ=Europe/Rome date +%H)" = "20" ]; then echo "send=true" >> "$GITHUB_OUTPUT"; else echo "send=false" >> "$GITHUB_OUTPUT"; fi
      - name: Scarica il repository
        if: steps.italy-time.outputs.send == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Invia report
        if: steps.italy-time.outputs.send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: mat.perrone@gmail.com
        run: python .github/scripts/send_daily_report.py
