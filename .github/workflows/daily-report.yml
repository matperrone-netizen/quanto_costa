name: Report quotidiano Costo Vero

on:
  schedule:
    # Minuto 17 per evitare il picco dei runner all'inizio dell'ora.
    - cron: '17 20 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Invia report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: mat.perrone@gmail.com
        run: python .github/scripts/send_daily_report.py
