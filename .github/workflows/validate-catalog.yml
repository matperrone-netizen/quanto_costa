name: Valida catalogo
on:
  pull_request:
    paths: [offers.json, .github/scripts/validate_catalog.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/validate_catalog.py offers.json
